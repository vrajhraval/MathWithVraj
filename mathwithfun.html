<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Spiral & Golden Ratio Visualizer</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2563eb;
            --background: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 850px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        /* Left Side: Visualization */
        .visual-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        canvas {
            background: #ffffff;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }

        .controls {
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-play { background-color: var(--accent); color: white; }
        .btn-play:hover { background-color: #1d4ed8; }
        .btn-reset { background-color: #64748b; color: white; }
        .btn-reset:hover { background-color: #475569; }

        /* Right Side: Data and Math */
        .data-panel {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            height: 480px;
            display: flex;
            flex-direction: column;
        }

        .ratio-banner {
            background: #e0f2fe;
            color: #0369a1;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .table-container {
            overflow-y: auto;
            flex-grow: 1;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background: #f1f5f9;
            position: sticky;
            top: 0;
            padding: 10px;
            color: var(--primary);
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid #f1f5f9;
        }

        tr.highlight-row {
            background-color: #f0fdf4;
            font-weight: bold;
            color: #166534;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>The Fibonacci Spiral & Golden Ratio</h1>
    <p class="subtitle">Adjust the slider to see how simple addition builds nature's signature spiral!</p>

    <div class="workspace">
        <div class="visual-panel">
            <h3 style="margin-top:0;">Live Spiral Canvas</h3>
            <canvas id="spiralCanvas" width="500" height="400"></canvas>
            
            <div class="controls">
                <div class="slider-group">
                    <span>Number of Squares:</span>
                    <input type="range" id="squareSlider" min="2" max="12" value="8">
                    <span id="sliderValue">8</span>
                </div>
                <div class="btn-group">
                    <button class="btn-play" onclick="startAnimation()">Animate</button>
                    <button class="btn-reset" onclick="resetVisualization()">Reset</button>
                </div>
            </div>
        </div>

        <div class="data-panel">
            <div class="ratio-banner" id="ratioBanner">
                Current Ratio (Fn ÷ Fn-1): Calculating...
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Step (n)</th>
                            <th>Fibonacci (Fn)</th>
                            <th>Ratio (Fn ÷ Fn-1)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('spiralCanvas');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('squareSlider');
const sliderValue = document.getElementById('sliderValue');
const tableBody = document.getElementById('tableBody');
const ratioBanner = document.getElementById('ratioBanner');

let animationId = null;
let currentStep = 2;

// Generate Fibonacci numbers dynamically up to required limit
function getFibonacciSequence(n) {
    let seq = [1, 1];
    for(let i = 2; i < n; i++) {
        seq.push(seq[i-1] + seq[i-2]);
    }
    return seq.slice(0, n);
}

// Draw the dynamic board
function draw(limit) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const seq = getFibonacciSequence(limit);
    
    // Scale factor keeps the canvas fitting dynamically as sizes explode
    let scale = 180 / seq[seq.length - 1]; 
    if (limit < 5) scale = 40; 

    // Visual anchor center point 
    let x = canvas.width / 2 + (limit > 5 ? seq[seq.length-2]*scale/2 : 0);
    let y = canvas.height / 2 - (limit > 5 ? seq[seq.length-3]*scale/2 : 0);

    let directions = [
        { dx: -1, dy: 0,  cx: 0,  cy: 0,  startAngle: 0,           endAngle: Math.PI/2 },     // Left
        { dx: 0,  dy: -1, cx: 0,  cy: 0,  startAngle: Math.PI/2,   endAngle: Math.PI },       // Up
        { dx: 0,  dy: 0,  cx: 1,  cy: 0,  startAngle: Math.PI,     endAngle: Math.PI*1.5 },   // Right
        { dx: -1, dy: -1, cx: 0,  cy: 1,  startAngle: Math.PI*1.5, endAngle: 0 }              // Down
    ];

    // Reset paths
    ctx.lineWidth = 1.5;
    
    for (let i = 0; i < limit; i++) {
        let size = seq[i] * scale;
        let dir = directions[i % 4];

        if (i > 0) {
            let prevSize = seq[i-1] * scale;
            if (i % 4 === 0) { x -= size; y += prevSize; }
            else if (i % 4 === 1) { x -= prevSize; y -= size; }
            else if (i % 4 === 2) { x += prevSize; }
            else if (i % 4 === 3) { y += prevSize; }
        } else {
            x -= size;
        }

        // 1. Draw Square Box
        ctx.strokeStyle = '#cbd5e0';
        ctx.strokeRect(x, y, size, size);

        // Fill inner subtle shade
        ctx.fillStyle = `rgba(37, 99, 235, ${0.03 + (i * 0.02)})`;
        ctx.fillRect(x, y, size, size);

        // 2. Put number tags inside square (Skip if too tiny)
        if(size > 15) {
            ctx.fillStyle = '#64748b';
            ctx.font = '12px sans-serif';
            ctx.fillText(seq[i], x + size/2 - 4, y + size/2 + 4);
        }

        // 3. Draw The Golden Arc
        ctx.beginPath();
        let arcX = x + dir.cx * size;
        let arcY = y + dir.cy * size;
        ctx.arc(arcX, arcY, size, dir.startAngle, dir.endAngle);
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 3;
        ctx.stroke();
    }
}

// Render values inside the data dashboard
function updateDataStructure(limit) {
    const seq = getFibonacciSequence(limit);
    tableBody.innerHTML = '';
    
    let lastRatio = "N/A";

    for (let i = 0; i < limit; i++) {
        let ratio = "—";
        if (i > 0) {
            ratio = (seq[i] / seq[i-1]).toFixed(5);
            lastRatio = ratio;
        }

        let row = document.createElement('tr');
        if (i === limit - 1) row.className = "highlight-row"; // Track active outer step

        row.innerHTML = `
            <td>${i + 1}</td>
            <td><strong>${seq[i]}</strong></td>
            <td>${ratio}</td>
        `;
        tableBody.appendChild(row);
    }

    // Update banner message for higher-level insight
    if(limit === 1) {
        ratioBanner.innerText = `Golden Ratio requires at least 2 numbers.`;
    } else {
        ratioBanner.innerHTML = `Current Ratio (F<sub>${limit}</sub> ÷ F<sub>${limit-1}</sub>) = <span style="font-size:1.2rem">${lastRatio}</span> ${limit > 8 ? '≈ φ (1.61803)' : ''}`;
    }
}

// Controller logic linking interactive changes
function updateVisualization(value) {
    sliderValue.innerText = value;
    draw(parseInt(value));
    updateDataStructure(parseInt(value));
}

function startAnimation() {
    if(animationId) clearInterval(animationId);
    
    let maxTarget = parseInt(slider.value);
    currentStep = 1;
    
    animationId = setInterval(() => {
        if(currentStep <= maxTarget) {
            updateVisualization(currentStep);
            currentStep++;
        } else {
            clearInterval(animationId);
        }
    }, 450); // Frame transitions smoothly every 450ms
}

function resetVisualization() {
    if(animationId) clearInterval(animationId);
    slider.value = 8;
    updateVisualization(8);
}
