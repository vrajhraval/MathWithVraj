<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grand Math Multiverse Archive</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)'], ['$', '$']],
                displayMath: [['$$', '$$']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        :root {
            --bg-deep: #020617;
            --bg-surface: #0f172a;
            --bg-card: #1e293b;
            --accent-neon: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: #334155;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .arcade-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .header-panel {
            text-align: center;
            padding: 2rem;
            background: var(--bg-surface);
            border: 2px solid var(--border-glow);
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .header-panel h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin: 0 0 0.5rem 0;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* Tier Navigation Tabs */
        .tier-navigation {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .tier-tab {
            background: var(--bg-surface);
            border: 2px solid var(--border-glow);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .tier-tab.active {
            border-color: #38bdf8;
            color: #38bdf8;
            background: var(--bg-card);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* Subject Selector Grid */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .subject-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .subject-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }

        .subject-card h3 {
            margin: 0 0 0.5rem 0;
            color: #f8fafc;
        }

        .subject-card p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Arena Layout */
        #arena-workspace {
            display: none;
            background: var(--bg-surface);
            border: 2px solid var(--border-glow);
            border-radius: 16px;
            padding: 2rem;
        }

        .arena-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .arena-grid { grid-template-columns: 1fr; }
        }

        .display-panel {
            background: rgba(2, 6, 23, 0.5);
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
        }

        .gujarati-block {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #334155;
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .input-panel {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .custom-input {
            background: var(--bg-deep);
            border: 2px solid var(--border-glow);
            color: white;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 6px;
            width: 80%;
            text-align: center;
            margin-bottom: 1rem;
        }

        .custom-input:focus { border-color: #38bdf8; outline: none; }

        .submit-btn {
            background: #38bdf8;
            color: #020617;
            font-weight: bold;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 80%;
        }

        .feedback-message {
            margin-top: 1rem;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 2.5rem;
            text-align: center;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .control-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .control-btn:hover { background: #475569; }
    </style>
</head>

            <h1>🌌 The Grand Mathematics Multiverse Archive</h1>
            <p style="color: var(--text-muted); margin: 0;">Comprehensive Academic Syllabus Coverage: School Units up to Postgraduate Fields (English & ગુજરાતી)</p>

        <div class="tier-navigation">

            <div class="tier-tab" onclick="switchTier('pg', this)">Postgraduate (PG)</div>

        <div id="arena-workspace">
            <div class="btn-container">

            <div class="arena-grid">

                    <div id="guj-story" class="gujarati-block"></div>

                <div class="input-panel">
                    <div id="interactive-game-field" style="width:100%; text-align:center;">
                        <input type="text" id="user-response-input" class="custom-input" placeholder="Type your numeric answer here" autocomplete="off">

                    </div>
                    <div id="arena-feedback" class="feedback-message"></div>
                </div>
            </div>
        </div>

    </div>

                            guj: "સામાન્ય સાપેક્ષતાવાદ (General Relativity) ના મિન્કોવસ્કી સ્પેસ-ટાઇમ મેટ્રિક ટેન્સર ડાયાગોનલ સિગ્નેચર \\((-1, 1, 1, 1)\\) નો ટ્રેસ (Trace) સરવાળો કેટલો થાય?",
                            ans: "2"
                        }
                    ]
                },
                "cryptography": {
                    title: "PG: Cryptography & Security",
                    desc: "RSA key mechanics, trapdoor permutations, and discrete logarithms.",
                    questions: [
                        {
                            eng: "An asymmetric RSA asymmetric cryptographic node uses twin prime keys \\(p=3\\) and \\(q=5\\). Compute the total system storage modulus parameter factor component: $$n = p \\times q$$",
                            guj: "ક્રિપ્ટોગ્રાફી એલગોરિધમ RSA પ્રણાલીમાં બે અવિભાજ્ય સંખ્યાઓ \\(p=3\\) અને \\(q=5\\) લેવામાં આવે છે. મોડ્યુલસ પેરામીટર \\(n\\) ની કિંમત શોધો: $$n = p \\times q$$",
                            ans: "15"
                        }
                    ]
                },
                "graph-theory": {
                    title: "PG: Discrete Graph Theory",
                    desc: "Matrix vertex matching, tree paths, and planar network color bounds.",
                    questions: [
                        {
                            eng: "According to the verified Four Color Theorem statement mapping for network planar nodes configurations, what is the maximum number of absolute tracking colors required to partition any complex planar map loop safely?",
                            guj: "ડિસ્ક્રીટ ગ્રાફ થીયરીના ફોર-કલર પ્રમેય (Four Color Theorem) મુજબ પ્લેનર મેપ ગ્રાફને રંગવા માટે વધુમાં વધુ કેટલા રંગોની જરૂર પડે?",
                            ans: "4"
                        }
                    ]
                }
            }
        };

        let activeTier = 'school';
        let currentSubjectKey = '';
        let currentQuestionIndex = 0;

        // Initialize and draw the category selector dynamically on load
        window.onload = function() {
            renderSubjectSelectorGrid();
        };

        function switchTier(tierId, tabElement) {
            activeTier = tierId;
            
            // Manage UI active styles on tabs
            document.querySelectorAll('.tier-tab').forEach(tab => tab.classList.remove('active'));
            tabElement.classList.add('active');
            
            exitArena();
            renderSubjectSelectorGrid();
        }

        function renderSubjectSelectorGrid() {
            const container = document.getElementById('subject-selector-zone');
            container.innerHTML = '';
            
            const selectedTierData = MasterQuestionDatabase[activeTier];
            
            for (let key in selectedTierData) {
                const subject = selectedTierData[key];
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.setAttribute('onclick', `enterArena('${key}')`);
                card.innerHTML = `
                    <h3>${subject.title}</h3>
                    <p>${subject.desc}</p>
                `;
                container.appendChild(card);
            }
        }

        function enterArena(subjectKey) {
            currentSubjectKey = subjectKey;
            currentQuestionIndex = 0;
            
            document.getElementById('subject-selector-zone').style.display = 'none';
            document.getElementById('arena-workspace').style.display = 'block';
            
            loadQuestionInstance();
        }

        function exitArena() {
            document.getElementById('subject-selector-zone').style.display = 'grid';
            document.getElementById('arena-workspace').style.display = 'none';
            document.getElementById('arena-feedback').innerHTML = '';
            document.getElementById('user-response-input').value = '';
        }

        function loadQuestionInstance() {
            const subject = MasterQuestionDatabase[activeTier][currentSubjectKey];
            const currentQuestion = subject.questions[currentQuestionIndex];
            
            // Update tracking parameters metrics
            document.getElementById('progress-tracker').innerText = `Question ${currentQuestionIndex + 1} / ${subject.questions.length}`;
            document.getElementById('branch-tag').innerText = subject.title;
            
            // Set bilingual content lines
            document.getElementById('eng-story').innerHTML = `<strong>Context Engine (EN):</strong><br>${currentQuestion.eng}`;
            document.getElementById('guj-story').innerHTML = `<strong>વિષયવસ્તુ સંદર્ભ (GU):</strong><br>${currentQuestion.guj}`;
            
            // Clear prior entry feedback lines
            document.getElementById('user-response-input').value = '';
            document.getElementById('arena-feedback').innerHTML = '';
            document.getElementById('arena-feedback').className = 'feedback-message';

            // Refresh MathJax rendering engine instantly
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }

        function verifyCurrentAnswer() {
            const subject = MasterQuestionDatabase[activeTier][currentSubjectKey];
            const currentQuestion = subject.questions[currentQuestionIndex];
            const userInput = document.getElementById('user-response-input').value.trim();
            const feedbackBox = document.getElementById('arena-feedback');

            if (userInput === currentQuestion.ans) {
                feedbackBox.className = "feedback-message text-correct";
                feedbackBox.innerHTML = "✨ Correct Integration! સાચો જવાબ છે!";
                
                // Shift to next question index sequence loop parameters
                if (currentQuestionIndex + 1 < subject.questions.length) {
                    currentQuestionIndex++;
                    setTimeout(loadQuestionInstance, 2000);
                } else {
                    setTimeout(() => {
                        feedbackBox.innerHTML = "🏆 Subject Core Clear! All system layers stabilized in this matrix.";
                        setTimeout(exitArena, 2500);
                    }, 2000);
                }
            } else {
                feedbackBox.className = "feedback-message text-error";
                feedbackBox.innerHTML = "❌ Transformation Failed. ખોટો જવાબ, ગણતરી ફરીથી તપાસો.";
            }
        }
    </script>
</body>
</html>
