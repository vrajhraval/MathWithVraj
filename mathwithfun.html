<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Spiral & Golden Ratio Visualizer</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2563eb;
            --background: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 850px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        /* Left Side: Visualization */
        .visual-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        canvas {
            background: #ffffff;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }

        .controls {
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-play { background-color: var(--accent); color: white; }
        .btn-play:hover { background-color: #1d4ed8; }
        .btn-reset { background-color: #64748b; color: white; }
        .btn-reset:hover { background-color: #475569; }

        /* Right Side: Data and Math */
        .data-panel {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            height: 480px;
            display: flex;
            flex-direction: column;
        }

        .ratio-banner {
            background: #e0f2fe;
            color: #0369a1;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .table-container {
            overflow-y: auto;
            flex-grow: 1;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background: #f1f5f9;
            position: sticky;
            top: 0;
            padding: 10px;
            color: var(--primary);
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid #f1f5f9;
        }

        tr.highlight-row {
            background-color: #f0fdf4;
            font-weight: bold;
            color: #166534;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>The Fibonacci Spiral & Golden Ratio</h1>
    <p class="subtitle">Change values using the slider to watch the graph update instantly!</p>

    <div class="workspace">
        <div class="visual-panel">
            <h3 style="margin-top:0;">Live Spiral Canvas</h3>
            <canvas id="spiralCanvas" width="500" height="400"></canvas>
            
            <div class="controls">
                <div class="slider-group">
                    <span>Number of Squares (N):</span>
                    <input type="range" id="squareSlider" min="2" max="15" value="8">
                    <span id="sliderValue">8</span>
                </div>
                <div class="btn-group">
                    <button class="btn-play" onclick="startAnimation()">Animate Step-by-Step</button>
                    <button class="btn-reset" onclick="resetVisualization()">Reset</button>
                </div>
            </div>
        </div>

        <div class="data-panel">
            <div class="ratio-banner" id="ratioBanner">
                Current Ratio (Fn ÷ Fn-1): Calculating...
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Step (n)</th>
                            <th>Fibonacci (Fn)</th>
                            <th>Ratio (Fn ÷ Fn-1)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('spiralCanvas');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('squareSlider');
const sliderValue = document.getElementById('sliderValue');
const tableBody = document.getElementById('tableBody');
const ratioBanner = document.getElementById('ratioBanner');

let animationInterval = null;

// Pre-calculate fixed Fibonacci numbers to prevent any logic breaking
function getFibonacciSequence(maxTerms) {
    let seq = [1, 1];
    for (let i = 2; i < maxTerms; i++) {
        seq.push(seq[i-1] + seq[i-2]);
    }
    return seq.slice(0, maxTerms);
}

// Fixed coordinate drawing logic to eliminate graph bugs
function drawSpiral(limit) {
    // Clear canvas completely
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const seq = getFibonacciSequence(limit);
    
    // Auto-scale setup based on the current highest number
    let maxFib = seq[seq.length - 1];
    let scale = 340 / (maxFib * 1.5); 
    if (limit < 6) scale = 35; // Don't let it look tiny for small values

    // Re-center system dynamically based on the current limit
    let x = canvas.width / 2;
    let y = canvas.height / 2;
    
    if (limit > 2) x += (seq[1] * scale) / 2;
    if (limit > 3) y += (seq[2] * scale) / 2;
    if (limit > 4) x -= (seq[3] * scale) / 2;
    if (limit > 5) y -= (seq[4] * scale) / 2;

    // Directions vector mappings
    const directions = [
        { nx: -1, ny: 0,  cx: 0, cy: 0, sa: 0,           ea: Math.PI / 2 },    // Left
        { nx: 0,  ny: -1, cx: 0, cy: 1, sa: Math.PI / 2,   ea: Math.PI },        // Up
        { nx: 0,  ny: 0,  cx: 1, cy: 1, sa: Math.PI,     ea: Math.PI * 1.5 },  // Right
        { nx: -1, ny: -1, cx: 1, cy: 0, sa: Math.PI * 1.5, ea: 0 }               // Down
    ];

    for (let i = 0; i < limit; i++) {
        let size = seq[i] * scale;
        let d = directions[i % 4];

        // Process alignment offsets dynamically relative to previous box size
        if (i > 0) {
            let prevSize = seq[i-1] * scale;
            if (i % 4 === 0) { x -= size; y += prevSize; }
            else if (i % 4 === 1) { x -= prevSize; y -= size; }
            else if (i % 4 === 2) { x += prevSize; }
            else if (i % 4 === 3) { y += prevSize; }
        } else {
            x -= size; // starting block adjustment
        }

        // Draw individual square box borders
        ctx.strokeStyle = '#cbd5e0';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, size, size);

        // Fill subtle gradient color background per square block
        ctx.fillStyle = `rgba(37, 99, 235, ${0.02 + (i * 0.025)})`;
        ctx.fillRect(x, y, size, size);

        // Write numbers inside boxes if big enough
        if (size > 18) {
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(seq[i], x + size/2 - 5, y + size/2 + 5);
        }

        // Draw the golden geometric spiral arc
        ctx.beginPath();
        let arcX = x + d.cx * size;
        let arcY = y + d.cy * size;
        ctx.arc(arcX, arcY, size, d.sa, d.ea);
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 3;
        ctx.stroke();
    }
}

// Render values inside the data table panel
function updateDataTable(limit) {
    const seq = getFibonacciSequence(limit);
    tableBody.innerHTML = '';
    let lastRatio = "N/A";

    for (let i = 0; i < limit; i++) {
        let ratio = "—";
        if (i > 0) {
            ratio = (seq[i] / seq[i-1]).toFixed(5);
            lastRatio = ratio;
        }

        let row = document.createElement('tr');
        if (i === limit - 1) row.className = "highlight-row";

        row.innerHTML = `
            <td>${i + 1}</td>
            <td><strong>${seq[i]}</strong></td>
            <td>${ratio}</td>
        `;
        tableBody.appendChild(row);
    }

    if (limit === 1) {
        ratioBanner.innerText = `Golden Ratio requires at least 2 steps.`;
    } else {
        ratioBanner.innerHTML = `Current Ratio (F<sub>${limit}</sub> ÷ F<sub>${limit-1}</sub>) = <span style="font-size:1.2rem; color:#2563eb;">${lastRatio}</span> ${limit > 7 ? '≈ φ (1.61803)' : ''}`;
    }
}

// Master state updater
function renderEverything(value) {
    let numericValue = parseInt(value);
    slider.value = numericValue;
    sliderValue.innerText = numericValue;
    drawSpiral(numericValue);
    updateDataTable(numericValue);
}

// Fixed Step Animation Logic
function startAnimation() {
    clearInterval(animationInterval);
    let targetMax = parseInt(slider.value);
    let step = 1;

    animationInterval = setInterval(() => {
        if (step <= targetMax) {
            renderEverything(step);
            step++;
        } else {
            clearInterval(animationInterval);
        }
    }, 400);
}

function resetVisualization() {
    clearInterval(animationInterval);
    renderEverything(8);
}

// Attach listener for instant real-time slider value updates
slider.addEventListener('input', (e) => {
    clearInterval(animationInterval);
    renderEverything(e.target.value);
});

// Initial load build configuration
renderEverything(8);
</script>

</body>
</html>
