<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduate Mathematics Directory</title>
    <!-- Tailwind CSS for modern layout styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js for all continuous/analytical graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Vis-network for topological/graph theory node networks -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .subject-card { transition: all 0.2s ease-in-out; }
        .subject-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 py-6 px-8 shadow-xs">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i data-lucide="sigma" class="w-8 h-8 text-blue-600"></i>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Graduate Mathematics Directory</h1>
            </div>
            <p class="text-sm text-slate-500 bg-slate-100 px-3 py-1 rounded-full border border-slate-200">16 Active Visualization Engines</p>
        </div>
    </header>

    <!-- Main Workspace Frame -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Navigation Sidebar List (16 Items) -->
        <div class="lg:col-span-4 bg-white border border-slate-200 rounded-xl p-4 shadow-xs h-[calc(100vh-12rem)] overflow-y-auto">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-3">Core & Applied Subfields</h2>
            <nav class="space-y-1" id="subject-menu">
                <!-- Navigation injection targeting block via JavaScript below -->
            </nav>
        </div>

        <!-- Right Column: Interactive Rendering Arena -->
        <div class="lg:col-span-8 flex flex-col space-y-6">
            <!-- Dynamic Sandbox Display Card -->
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-xs flex-1 flex flex-col min-h-[450px]">
                <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
                    <div>
                        <h2 id="active-title" class="text-xl font-bold text-slate-900">Select a Subject Module</h2>
                        <p id="active-desc" class="text-sm text-slate-500 mt-0.5">Choose an arena from the directory list to activate its specialized interactive visualization calculation framework engine.</p>
                    </div>
                    <span id="active-badge" class="text-xs font-semibold px-2.5 py-1 rounded-md bg-blue-50 text-blue-700 border border-blue-100">Pure Math</span>
                </div>

                <!-- Dynamic Component Workspace Viewports -->
                <div class="relative flex-1 w-full flex items-center justify-center min-h-[350px]">
                    <!-- Canvas Chart Framework Layout Slot -->
                    <canvas id="chart-viewport" class="w-full h-full max-h-[380px]"></canvas>
                    <!-- Vis Node Structural Framework Layout Slot -->
                    <div id="network-viewport" class="absolute inset-0 w-full h-full hidden"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Global Application Engine Logic Script -->
    <script>
        // Global visual viewport references
        let activeChartInstance = null;
        let activeNetworkInstance = null;

        const subjectDatabase = [
            { id: "real-analysis", title: "1. Real Analysis", desc: "Sequence convergence profile verifying bounds relative to an arbitrary epsilon limit criteria.", type: "Pure Math" },
            { id: "complex-analysis", title: "2. Complex Analysis", desc: "Mapping the exponential mapping orbit trajectory projection space across imaginary unit components.", type: "Pure Math" },
            { id: "abstract-algebra", title: "3. Abstract Algebra", desc: "Discrete elements distribution mapped inside a finite multiplicative cyclic ring space.", type: "Pure Math" },
            { id: "linear-algebra", title: "4. Linear Algebra", desc: "Spatial grid basis coordinate transformations under a custom 2D matrix transformation.", type: "Pure Math" },
            { id: "topology", title: "5. Topology", desc: "Planar graph invariants testing standard Euler structures over spatial geometry.", type: "Pure Math" },
            { id: "number-theory", title: "6. Number Theory", desc: "Successive remainder periodic loop calculations wrapped inside modular systems.", type: "Pure Math" },
            { id: "odes", title: "7. Ordinary Differential Equations", desc: "Continuous scale calculations of classic time-domain exponential decay functions.", type: "Applied Math" },
            { id: "pdes", title: "8. Partial Differential Equations", desc: "Steady-state linear temperature gradient mapping over a Dirichlet spatial boundary.", type: "Applied Math" },
            { id: "functional-analysis", title: "9. Functional Analysis", desc: "Evaluating coordinate magnitudes against an aggregate L2 space vector norm limit bound.", type: "Pure Math" },
            { id: "graph-theory", title: "10. Graph Theory", desc: "Adjacency matrix layouts visualizing symmetric networks and link densities.", type: "Pure Math" },
            { id: "operator-theory", title: "11. Operator Theory", desc: "Tracking resolvent metric mapping curves approaching a spectrum pole singularity point.", type: "Pure Math" },
            { id: "banach-algebra", title: "12. Banach Algebra", desc: "Verifying norm inequalities mapping the structural properties of complex algebras.", type: "Pure Math" },
            { id: "math-methods", title: "13. Mathematical Methods", desc: "Fourier series harmonic step expansions reconstructing a perfect target square wave.", type: "Applied Math" },
            { id: "relativity", title: "14. Relativity", desc: "Lorentz transformation curve tracking time dilation curves as velocity approaches light speed.", type: "Applied Math" },
            { id: "classical-mech", title: "15. Classical Mechanics", desc: "Evaluating fundamental harmonic period variations across structural physical system lengths.", type: "Applied Math" },
            { id: "diff-geometry", title: "16. Differential Geometry", desc: "Intrinsic helix curve spiral mapping featuring local tangent directional tracks.", type: "Pure Math" }
        ];

        // Core Window Setup Routing Initialization
        window.addEventListener('DOMContentLoaded', () => {
            renderSidebarNavigation();
            activateSubjectModule("real-analysis"); // Default initial launch target
            lucide.createIcons();
        });

        function renderSidebarNavigation() {
            const menuContainer = document.getElementById('subject-menu');
            subjectDatabase.forEach(sub => {
                const button = document.createElement('button');
                button.id = `nav-${sub.id}`;
                button.className = "subject-card w-full flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-lg text-left text-slate-600 hover:bg-slate-100 hover:text-slate-900 cursor-pointer";
                button.onclick = () => activateSubjectModule(sub.id);
                
                button.innerHTML = `
                    <div class="flex items-center space-x-2.5 truncate">
                        <span class="w-2 h-2 rounded-full ${sub.type === 'Pure Math' ? 'bg-blue-500' : 'bg-emerald-500'}"></span>
                        <span class="truncate">${sub.title}</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                `;
                menuContainer.appendChild(button);
            });
        }

        function clearViewports() {
            if(activeChartInstance) { activeChartInstance.destroy(); activeChartInstance = null; }
            if(activeNetworkInstance) { activeNetworkInstance.destroy(); activeNetworkInstance = null; }
            document.getElementById('chart-viewport').style.display = 'none';
            document.getElementById('network-viewport').style.display = 'none';
        }

        function activateSubjectModule(id) {
            const subject = subjectDatabase.find(s => s.id === id);
            if(!subject) return;

            // Highlight Active Navbar Element
            subjectDatabase.forEach(s => {
                const btn = document.getElementById(`nav-${s.id}`);
                if(btn) btn.className = btn.className.replace(" bg-blue-50 text-blue-700", "").replace(" font-semibold", "");
            });
            const activeBtn = document.getElementById(`nav-${id}`);
            if(activeBtn) activeBtn.className += " bg-blue-50 text-blue-700 font-semibold";

            // Update UI Information Panel Headers
            document.getElementById('active-title').innerText = subject.title;
            document.getElementById('active-desc').innerText = subject.desc;
            
            const badge = document.getElementById('active-badge');
            badge.innerText = subject.type;
            badge.className = `text-xs font-semibold px-2.5 py-1 rounded-md border ${subject.type === 'Pure Math' ? 'bg-blue-50 text-blue-700 border-blue-100' : 'bg-emerald-50 text-emerald-700 border-emerald-100'}`;

            clearViewports();
            
            // Core Engine Router Pipeline Selection Switch
            const useNetwork = ["topology", "graph-theory"].includes(id);
            if(useNetwork) {
                document.getElementById('network-viewport').style.display = 'block';
                renderNetworkEngine(id);
            } else {
                document.getElementById('chart-viewport').style.display = 'block';
                renderChartEngine(id);
            }
        }

        // =====================================================================
        // Continuous Chart Rendering Framework Engine
        // =====================================================================
        function renderChartEngine(id) {
            const ctx = document.getElementById('chart-viewport').getContext('2d');
            let chartConfig = { type: 'line', data: { datasets: [] }, options: { responsive: true, maintainAspectRatio: false } };

            switch(id) {
                case "real-analysis":
                    let raPoints = Array.from({length: 30}, (_, i) => ({ x: i+1, y: 1/(i+1) }));
                    chartConfig.data.datasets = [
                        { label: 'a_n = 1/n', data: raPoints, borderColor: '#2563eb', backgroundColor: '#2563eb', showLine: true, tension: 0.1 },
                        { label: 'Epsilon Limit (ε = 0.08)', data: [{x:1, y:0.08}, {x:30, y:0.08}], borderColor: '#ef4444', borderDash: [6,4], pointRadius: 0 }
                    ];
                    chartConfig.options.scales = { x: { type: 'linear', title: { display: true, text: 'Index (n)' } }, y: { min: 0, max: 1.1 } };
                    break;

                case "complex-analysis":
                    let cxCircle = Array.from({length: 100}, (_, i) => { let t = (i/99)*2*Math.PI; return { x: Math.cos(t), y: Math.sin(t) }; });
                    let angle = Math.PI / 3; // 60 degrees target point vector transformation 
                    chartConfig.data.datasets = [
                        { label: 'Unit Circle Plane Boundary', data: cxCircle, borderColor: '#cbd5e1', pointRadius: 0, showLine: true },
                        { label: 'e^(i*θ) Transformation Vector', data: [{x:0,y:0}, {x: Math.cos(angle), y: Math.sin(angle)}], borderColor: '#2563eb', showLine: true, pointRadius: 4, backgroundColor: '#2563eb' }
                    ];
                    chartConfig.options.scales = { x: { type: 'linear', min: -1.2, max: 1.2 }, y: { min: -1.2, max: 1.2 } };
                    break;

                case "abstract-algebra":
                    let g = 2, p = 11, aaPoints = [];
                    let curr = 1;
                    for(let k=0; k<11; k++) {
                        aaPoints.push({ x: k, y: curr });
                        curr = (curr * g) % p;
                    }
                    chartConfig.type = 'bar';
                    chartConfig.data.labels = aaPoints.map(p => `k=${p.x}`);
                    chartConfig.data.datasets = [{ label: 'g^k mod p Group Residues', data: aaPoints.map(p => p.y), backgroundColor: '#2563eb' }];
                    break;

                case "linear-algebra":
                    chartConfig.data.datasets = [
                        { label: 'Basis Vector i-hat', data: [{x:0,y:0}, {x:1,y:0}], borderColor: '#cbd5e1', borderDash:[4,4], showLine:true },
                        { label: 'Basis Vector j-hat', data: [{x:0,y:0}, {x:0,y:1}], borderColor: '#cbd5e1', borderDash:[4,4], showLine:true },
                        { label: 'Transformed Basis Ax_1', data: [{x:0,y:0}, {x:2,y:1}], borderColor: '#2563eb', showLine:true, pointRadius: 5 },
                        { label: 'Transformed Basis Ax_2', data: [{x:0,y:0}, {x:1,y:3}], borderColor: '#ef4444', showLine:true, pointRadius: 5 }
                    ];
                    chartConfig.options.scales = { x: { type: 'linear', min:-0.5, max: 3.5 }, y: { min:-0.5, max:3.5 } };
                    break;

                case "number-theory":
                    let ntPoints = Array.from({length: 20}, (_, i) => ({ x: i, y: Math.pow(3, i) % 7 }));
                    chartConfig.data.datasets = [{ label: '3^k mod 7 Periodic Elements Track', data: ntPoints, borderColor: '#2563eb', showLine:true, tension:0.1 }];
                    chartConfig.options.scales = { x: { type: 'linear', title: { display:true, text:'Exponent Step Index' } }, y: { min:0, max:7 } };
                    break;

                case "odes":
                    let odePoints = Array.from({length: 50}, (_, i) => { let t = i*0.1; return { x: t, y: 10 * Math.exp(-0.6 * t) }; });
                    chartConfig.data.datasets = [{ label: 'y(t) Continuous Decay Flow Matrix', data: odePoints, borderColor: '#2563eb', pointRadius:0, showLine:true }];
                    chartConfig.options.scales = { x: { type: 'linear', title: { display:true, text:'Time (t)' } } };
                    break;

                case "pdes":
                    let pdePoints = Array.from({length: 20}, (_, i) => { let x = i/19; return { x: x, y: 80 + x * (20 - 80) }; });
                    chartConfig.data.datasets = [{ label: 'Steady-State Linear Heat Solution u(x)', data: pdePoints, borderColor: '#2563eb', showLine:true }];
                    break;

                case "functional-analysis":
                    chartConfig.type = 'bar';
                    chartConfig.data.labels = ['x_1 Coordinate', 'x_2 Coordinate', 'x_3 Coordinate', 'L2 Vector Norm Threshold'];
                    chartConfig.data.datasets = [{ label: 'Space Elements Evaluation Magnitude', data: [3, 4, 12, 13], backgroundColor: ['#cbd5e1','#cbd5e1','#cbd5e1','#2563eb'] }];
                    break;

                case "operator-theory":
                    let opPoints = Array.from({length: 50}, (_, i) => { let lam = 2.2 + (i/49)*5; return { x: lam, y: 1 / (lam - 2) }; });
                    chartConfig.data.datasets = [{ label: 'Resolvent R(λ) Scale Graph', data: opPoints, borderColor: '#2563eb', pointRadius:0, showLine:true }];
                    chartConfig.options.scales = { x: { type: 'linear', title: { display:true, text: 'Spectrum Operator Spectrum Parameter (λ)' } } };
                    break;

                case "banach-algebra":
                    chartConfig.type = 'bar';
                    chartConfig.data.labels = ['||A|| Element Norm', '||B|| Element Norm', '||A|| * ||B|| Sub-multiplicative Limit'];
                    chartConfig.data.datasets = [{ label: 'Algebra Space Boundary Profiles', data: [4, 3, 12], backgroundColor: ['#cbd5e1','#cbd5e1','#2563eb'] }];
                    break;

                case "math-methods":
                    let mmPoints = Array.from({length: 200}, (_, i) => {
                        let t = -Math.PI + (i/199)*2*Math.PI;
                        let f = (4/Math.PI) * (Math.sin(t) + Math.sin(3*t)/3 + Math.sin(5*t)/5);
                        return { x: t, y: f };
                    });
                    chartConfig.data.datasets = [{ label: 'Fourier Approximation (5 Harmonics Partial Sum)', data: mmPoints, borderColor: '#2563eb', pointRadius:0, showLine:true }];
                    break;

                case "relativity":
                    let relPoints = Array.from({length: 50}, (_, i) => { let v = (i/49)*0.9; return { x: v, y: 10 / Math.sqrt(1 - v*v) }; });
                    chartConfig.data.datasets = [{ label: 'Lorentz Expansion Dilation Profile Matrix', data: relPoints, borderColor: '#2563eb', pointRadius:0, showLine:true }];
                    chartConfig.options.scales = { x: { type: 'linear', title: { display:true, text: 'Fractional Speed Velocity Ratio (v/c)' } } };
                    break;

                case "classical-mech":
                    let cmPoints = Array.from({length: 50}, (_, i) => { let L = 0.1 + (i/49)*4.9; return { x: L, y: 2 * Math.PI * Math.sqrt(L / 9.81) }; });
                    chartConfig.data.datasets = [{ label: 'Swing System Period Tracker Range T(L)', data: cmPoints, borderColor: '#2563eb', pointRadius:0, showLine:true }];
                    chartConfig.options.scales = { x: { type: 'linear', title: { display:true, text: 'Pendulum Structural Length Scale (meters)' } } };
                    break;

                case "diff-geometry":
                    let dgPoints = Array.from({length: 100}, (_, i) => { let t = (i/99)*10; return { x: Math.cos(t), y: Math.sin(t) }; });
                    chartConfig.data.datasets = [
                        { label: 'Helix Projection Path Matrix 2D Profile', data: dgPoints, borderColor: '#cbd5e1', pointRadius:0, showLine:true },
                        { label: 'Instantaneous Local Tangent Track r\'(t)', data: [{x:0.54, y:0.84}, {x:-0.3, y:1.38}], borderColor: '#2563eb', showLine:true, pointRadius:3 }
                    ];
                    break;
            }

            activeChartInstance = new Chart(ctx, chartConfig);
        }

        // =====================================================================
        // Topological & Network Node Structures Rendering Engine
        // =====================================================================
        function renderNetworkEngine(id) {
            const container = document.getElementById('network-viewport');
            let data = { nodes: [], edges: [] };
            const options = {
                nodes: { shape: 'circle', color: { background: '#2563eb', border: '#1d4ed8' }, font: { color: '#ffffff', size: 14, face: 'sans-serif' }, borderWidth: 2 },
                edges: { color: '#cbd5e1', width: 2, smooth: false },
                physics: { stabilization: true }
            };

            if(id === "topology") {
                // Classic Tetrahedron Graph (4 Nodes, Complete Structure Invariant Topology)
                data.nodes = [ {id:1, label:'V1'}, {id:2, label:'V2'}, {id:3, label:'V3'}, {id:4, label:'V4'} ];
                data.edges = [
                    {from:1, to:2}, {from:1, to:3}, {from:1, to:4},
                    {from:2, to:3}, {from:2, to:4}, {from:3, to:4}
                ];
            } else if(id === "graph-theory") {
                // Symmetric Matrix Structure K_5 Network
                data.nodes = Array.from({length: 5}, (_, i) => ({ id: i+1, label: `N${i+1}` }));
                for(let i=1; i<=5; i++) {
                    for(let j=i+1; j<=5; j++) {
                        data.edges.push({ from: i, to: j });
                    }
                }
            }

            activeNetworkInstance = new vis.Network(container, data, options);
        }
    </script>
</body>
</html>
